<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/auth.css">
    <title>Document</title>
</head>
<body>
    <div class="card-register">
        <h1>Login</h1>

        <form id="login-form">
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Senha" required>
                
            <button type="submit">Entrar</button>
            
            <p class="switch-auth">
                Não tem login? <a href="register.html">Cadastre-se!</a>
            </p>
            
            <div id="error-message"></div>
            
        </form>

    </div>    

    <script src="../js/utils/auth.js"       type="module"></script>
    <script src="../js/api/config.js"       type="module"></script>
    <script src="../js/api/auth.js"         type="module"></script>
    <script src="../js/pages/login.js"      type="module"></script>

</body>
</html>
